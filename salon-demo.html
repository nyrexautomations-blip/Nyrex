<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salon WhatsApp demo | Nyrex</title>
<meta name="description" content="A 30-second sample of Nyrex answering salon WhatsApp questions and handing booking requests to staff.">
<link rel="stylesheet" href="/styles.css">
<style>
body.demo-page{background:#071b17;color:#fff}.demo-shell{min-height:100svh;display:grid;place-items:center;padding:24px}.demo-wrap{width:min(100%,560px);display:grid;gap:16px}.demo-label{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#bcebdc;font-size:14px}.demo-frame{width:min(100%,420px);aspect-ratio:9/16;margin:auto;position:relative;border-radius:28px;overflow:hidden;background:#f2f7f3;color:#12251e;box-shadow:0 30px 80px #0008}.demo-frame canvas{width:100%;height:100%;display:block}.demo-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.demo-controls button,.demo-controls a{border:1px solid #83ceb0;background:#0d3028;color:white;border-radius:999px;padding:12px 18px;font:600 14px inherit;text-decoration:none;cursor:pointer}.demo-controls button:hover,.demo-controls a:hover{background:#14503f}.demo-help{text-align:center;color:#bcebdc;font-size:13px;line-height:1.5}.demo-status{min-height:1.4em;text-align:center;color:#bcebdc;font-size:13px}.demo-logo{font-size:14px;letter-spacing:.02em;font-weight:700}.demo-logo i{color:#79d9ae;font-style:normal}@media(max-width:480px){.demo-shell{padding:12px}.demo-frame{width:min(100%,390px);border-radius:22px}}
</style>
</head>
<body class="demo-page">
<main class="demo-shell"><div class="demo-wrap">
  <div class="demo-label"><span class="demo-logo">nyrex<i>.</i> / salon sample</span><span id="clock">00:00 / 00:30</span></div>
  <div class="demo-frame"><canvas id="reel" width="1080" height="1920" aria-label="Animated 30-second demo of a salon WhatsApp assistant"></canvas></div>
  <div class="demo-controls"><button type="button" id="play">Replay demo</button><button type="button" id="export">Export video</button><a href="/pilot.html#request">Request your salon demo</a></div>
  <p class="demo-status" id="status" role="status" aria-live="polite"></p>
  <p class="demo-help">This is a fictional salon example. Prices, hours and replies are placeholders. The export is a silent WebM; add a licensed music track in your editor before posting.</p>
</div></main>
<script>
(function(){
 const c=document.getElementById('reel'),ctx=c.getContext('2d'),clock=document.getElementById('clock'),status=document.getElementById('status');
 const W=1080,H=1920,D=30;let start=performance.now(),pausedAt=null,recording=false;
 const scenes=[
  {a:0,b:4.5,k:'hook',title:'A salon is busy.',sub:'The WhatsApp messages still come in.',zoom:1.05},
  {a:4.5,b:10.5,k:'chat',title:'“Do you do hair colouring?”',sub:'Glow Studio · sample reply',who:'CUSTOMER',msg:'Do you do hair colouring?',reply:'Yes. We offer global colour and highlights. Want our team to share options?',zoom:1.16},
  {a:10.5,b:16.3,k:'chat',title:'“Are you open Sunday?”',sub:'Answered from salon-approved hours.',who:'CUSTOMER',msg:'Are you open Sunday?',reply:'We are closed Sunday and open Mon–Sat, 10 am–7 pm.',zoom:1.23},
  {a:16.3,b:23.7,k:'handoff',title:'“Can I come tomorrow at 5?”',sub:'A request goes to the salon team to confirm.',who:'CUSTOMER',msg:'Can I book tomorrow at 5 pm?',reply:'I’ve noted your request. Our team will confirm the available time shortly.',zoom:1.3},
  {a:23.7,b:27.3,k:'handoff',title:'The salon stays in control.',sub:'Staff confirms the appointment.',who:'SALON TEAM',msg:'Booking request received',reply:'Customer, service and preferred time sent for confirmation.',zoom:1.14},
  {a:27.3,b:30,k:'end',title:'Routine replies. Clear handoffs.',sub:'Try Nyrex free for 14 days.',zoom:1}
 ];
 function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
 function text(t,x,y,size,color,weight='500',max=900){ctx.fillStyle=color;ctx.font=weight+' '+size+'px system-ui,Segoe UI,Arial';ctx.textAlign='left';ctx.textBaseline='top';let words=t.split(' '),line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>max&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*size*1.28));return lines.length*size*1.28}
 function wrap(t,max,size){ctx.font='500 '+size+'px system-ui,Segoe UI,Arial';const lines=[];let l='';for(const w of t.split(' ')){const n=l?l+' '+w:w;if(ctx.measureText(n).width>max&&l){lines.push(l);l=w}else l=n}if(l)lines.push(l);return lines}
 function bubble(t,x,y,w,bg,fg,align='left'){const pad=30,fs=37,lines=wrap(t,w-pad*2,fs),h=pad*2+lines.length*fs*1.28;rr(x,y,w,h,26,bg);ctx.fillStyle=fg;ctx.font='500 '+fs+'px system-ui,Segoe UI,Arial';ctx.textAlign=align;ctx.textBaseline='top';lines.forEach((line,i)=>ctx.fillText(line,align==='right'?x+w-pad:x+pad,y+pad+i*fs*1.28));return h}
 function draw(t){const s=scenes.find(x=>t>=x.a&&t<x.b)||scenes[scenes.length-1],p=Math.max(0,Math.min(1,(t-s.a)/(s.b-s.a)));ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f5faf6');g.addColorStop(1,'#dcefe4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const pulse=Math.sin(Math.min(1,p)*Math.PI),zoom=1+(s.zoom-1)*pulse;ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
  ctx.fillStyle='#0d3028';ctx.fillRect(0,0,W,270);text('nyrex.',74,68,60,'#fff','750');text('SALON WHATSAPP DEMO',74,160,27,'#aee8d2','700');
  if(s.k==='hook'||s.k==='end'){
   const y=s.k==='hook'?580:630;text(s.title,75,y,82,'#10251e','760',920);text(s.sub,78,y+240,43,'#3b6654','500',900);
   if(s.k==='hook'){rr(80,1230,920,220,36,'#fff','#c9dfd1');text('New customer message',130,1280,29,'#5b796a','600');text('“Can I book for tomorrow?”',130,1350,44,'#142820','650')}
   else{rr(80,1290,920,260,36,'#0c7c5b');text('Free 14-day pilot',130,1345,48,'#fff','700');text('nyrex.pages.dev/pilot.html',130,1430,34,'#d6ffea','500')}
  } else {
   rr(60,340,960,1230,50,'#fff','#d4e2d7');ctx.fillStyle='#f5faf6';ctx.fillRect(63,343,954,150);ctx.fillStyle='#147a59';ctx.beginPath();ctx.arc(135,416,38,0,Math.PI*2);ctx.fill();text('G',120,390,38,'#fff','700');text('Glow Studio',200,380,37,'#142820','700');text('Hair & beauty · sample business',200,431,23,'#698174','500');
   let y=545;if(s.k==='handoff'&&s.who==='SALON TEAM'){text('NYREX ALERT TO THE TEAM',105,y,25,'#46705d','700');y+=70}
   const h1=bubble(s.msg,105,y,750,'#e7f4eb','#163528','left');y+=h1+26;const h2=bubble(s.reply,225,y,730,'#dcf2e8','#123a29','left');y+=h2+42;
   if(s.k==='handoff'){rr(105,1360,870,145,28,'#f0f5ef','#c9dbcc');text('Staff confirms availability',140,1392,33,'#244735','700');text('No appointment is promised by the demo.',140,1440,25,'#52715f','500')}
  }
  ctx.restore();
  const pct=Math.max(0,Math.min(1,t/D));ctx.fillStyle='#cfddd3';ctx.fillRect(60,H-76,W-120,10);ctx.fillStyle='#0d8c66';ctx.fillRect(60,H-76,(W-120)*pct,10);
  const sec=Math.floor(t);clock.textContent='00:'+String(sec).padStart(2,'0')+' / 00:30';
 }
 function tick(now){if(pausedAt===null){const t=Math.min(D,(now-start)/1000);draw(t);if(t<D)requestAnimationFrame(tick);else{draw(D-.001);if(recording)finishRecord()}}}
 document.getElementById('play').addEventListener('click',()=>{if(recording)return;start=performance.now();pausedAt=null;requestAnimationFrame(tick)});
 function finishRecord(){recording=false;try{recorder.stop()}catch(e){}}
 let recorder;
 document.getElementById('export').addEventListener('click',()=>{if(!window.MediaRecorder||!c.captureStream){status.textContent='This browser cannot export the video. Use the animated demo on this page instead.';return}if(recording)return;const stream=c.captureStream(30);let mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){status.textContent='WebM export is not supported in this browser.';return}const parts=[];recorder=new MediaRecorder(stream,{mimeType:mime});recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};recorder.onstop=()=>{const blob=new Blob(parts,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nyrex-salon-demo.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);stream.getTracks().forEach(x=>x.stop());status.textContent='Exported 30-second silent WebM. Add licensed music in your editor before posting.'};recording=true;status.textContent='Recording the 30-second demo…';start=performance.now();pausedAt=null;recorder.start();requestAnimationFrame(tick)});
 draw(0);requestAnimationFrame(tick);
})();
</script>
</body></html>
